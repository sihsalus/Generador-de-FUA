services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${FuaGen_DB__USER:-fuagenerator}
      POSTGRES_PASSWORD: ${FuaGen_DB_PASSWORD:-fuagenerator}
      POSTGRES_DB: ${FuaGen_DB_NAME:-fuagenerator}
    volumes:
      - FuaGenerator_DB_Data:/var/lib/postgresql/data
     # - ./init.sql:/docker-entrypoint-initdb.d/init.sql  # Optional initialization
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FuaGen_DB__USER:-fuagenerator} -d ${FuaGen_DB_NAME:-fuagenerator}"]
      interval: 5s
      timeout: 5s
      retries: 5


  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_USER: ${FuaGen_DB__USER:-fuagenerator}
      DB_PASSWORD: ${FuaGen_DB_PASSWORD:-fuagenerator}
      DB_NAME: ${FuaGen_DB_NAME:-fuagenerator}
      DB_PORT: 5432
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    links:
      - db

volumes:
  FuaGenerator_DB_Data:
