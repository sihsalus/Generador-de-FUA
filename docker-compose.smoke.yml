services:
  db:
    # Match the PostgreSQL major version used by SIHSALUS.
    image: postgres:17

  app:
    environment:
      NODE_ENV: production
      TOKEN: ${FUA_SMOKE_TOKEN}
      SECRET_KEY: ${FUA_SMOKE_SECRET_KEY}
      HMAC_SECRET: ${FUA_SMOKE_HMAC_SECRET}
      ENCRYPTION_KEY: ${FUA_SMOKE_ENCRYPTION_KEY}
